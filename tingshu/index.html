<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TXT 听书</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div id="topTitle">TXT 听书</div>
  <button id="btnRefresh" class="icon-btn" title="刷新" hidden>↻</button>
</header>

<main>
  <section id="view-shelf" class="view">
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept=".txt,text/plain">
      <span class="drop-icon">＋</span>
      <span class="drop-title">导入 TXT 小说</span>
      <span class="drop-sub">支持 UTF-8 / GBK · 文件只保存在本机</span>
    </label>
    <div class="section-title">书架</div>
    <div id="bookList" class="list"></div>
    <div id="shelfEmpty" class="empty">还没有书，先导入一本吧</div>
  </section>

  <section id="view-book" class="view" hidden>
    <div id="bookMeta" class="book-meta"></div>
    <div class="seg-tabs">
      <button class="seg-tab active" data-tab="chapters">章节</button>
      <button class="seg-tab" data-tab="cast">角色与音色</button>
    </div>
    <div id="chaptersPanel"></div>
    <div id="castPanel" hidden></div>
  </section>

  <section id="view-player" class="view" hidden>
    <div id="nowChapter" class="now-chapter"></div>
    <div id="segList" class="seg-list"></div>
  </section>

  <section id="view-settings" class="view" hidden>
    <div class="card">
      <div class="card-title">MiMo 语音合成</div>
      <label class="field">
        <span>API Key</span>
        <input id="apiKey" type="password" placeholder="在 platform.xiaomimimo.com 生成" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>接口地址</span>
        <input id="baseUrl" type="url" placeholder="https://api.xiaomimimo.com/v1" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <button id="btnTest" class="btn">测试合成</button>
        <button id="btnSaveSettings" class="btn primary">保存</button>
      </div>
      <p class="hint">Key 只存在这台设备的浏览器里，不会上传到任何服务器。</p>
    </div>

    <div class="card">
      <div class="card-title">AI 角色解析 <span class="hint">可选</span></div>
      <label class="field">
        <span>接口地址</span>
        <input id="aiBaseUrl" type="url" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="aiKey" type="password" placeholder="服务商提供的 Key" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>模型</span>
        <input id="aiModel" type="text" placeholder="如 deepseek-chat / mimo-v2.6-flash" autocomplete="off" spellcheck="false">
      </label>
      <div class="row">
        <button id="btnAiTest" class="btn">连接测试</button>
        <button id="btnSaveAi" class="btn primary">保存</button>
      </div>
      <p class="hint">用你自己的模型按章分析角色、性别、音色和语气；Key 只存本机，调用会产生你账号的费用。</p>
    </div>

    <div class="card">
      <div class="card-title">播放</div>
      <label class="switch-row">
        <span>只用一个音色朗读全书</span>
        <input id="singleVoice" type="checkbox">
      </label>
      <label class="switch-row">
        <span>屏幕常亮</span>
        <input id="keepAwake" type="checkbox">
      </label>
    </div>

    <div class="card">
      <div class="card-title">缓存</div>
      <div id="cacheInfo" class="hint"></div>
      <div class="row">
        <button id="btnClearCache" class="btn danger">清空音频缓存</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">关于</div>
      <p class="hint">TXT 只在本机解析；音频由小米 MiMo TTS 合成。MiMo TTS 目前限时免费。</p>
    </div>
  </section>
</main>

<div id="aiOverlay" class="overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <span id="aiTitle">AI 解析</span>
      <button id="aiClose" class="icon-btn" title="关闭">✕</button>
    </div>
    <div id="aiBody" class="modal-body"></div>
    <div class="modal-foot">
      <button id="aiCancel" class="btn">取消</button>
      <button id="aiApply" class="btn primary" hidden>应用所选</button>
    </div>
  </div>
</div>

<footer id="playerBar" hidden>
  <div class="pb-main" id="pbMain">
    <div class="pb-title" id="pbTitle">—</div>
    <div class="pb-sub" id="pbSub">—</div>
  </div>
  <div class="pb-controls">
    <button id="btnPrev" class="pb-btn" title="上一段">⏮</button>
    <button id="btnPlay" class="pb-btn play" title="播放">▶</button>
    <button id="btnNext" class="pb-btn" title="下一段">⏭</button>
  </div>
</footer>

<nav id="tabbar">
  <button class="tab active" data-nav="shelf"><span>▤</span>书架</button>
  <button class="tab" data-nav="book"><span>☰</span>本书</button>
  <button class="tab" data-nav="player"><span>◉</span>播放</button>
  <button class="tab" data-nav="settings"><span>⚙</span>设置</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
